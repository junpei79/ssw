<style>

background:#e7edf5;border-radius:99px;overflow:hidden}.progress span{height:100%;display:block;background:var(--blue);border-radius:99px;transition:width .25s}.progressrow{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin:8px 0 15px}.chapterlist{display:grid;gap:11px}.chapter{display:flex;align-items:center;gap:13px;padding:12px;border:1px solid var(--line);border-radius:12px}.chaptericon{width:42px;height:42px;background:#f2f5fa;border-radius:11px;display:grid;place-items:center;font-size:20px}.chapterinfo{flex:1;min-width:0}.chapterinfo strong{display:block;font-size:13px}.chapterinfo small{color:var(--muted);font-size:11px}.status{font-size:11px;font-weight:700;color:#64748b;background:#f0f3f8;padding:5px 8px;border-radius:99px;white-space:nowrap}.status.done{color:var(--green);background:#e6f7ef}.task{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{margin-top:5px;accent-color:var(--blue);width:16px;height:16px}.task strong{display:block;font-size:13px}.task small{color:var(--muted);font-size:12px}.task.checked strong{text-decoration:line-through;color:#7a8799}.word-of-day{background:#142b4a;color:white;border-radius:14px;padding:18px;margin-top:17px}.word-of-day .jp{font-size:27px;font-weight:800;margin:4px 0}.word-of-day .reading{color:#b8d0ff;font-size:13px}.word-of-day p{margin:6px 0 14px;color:#d5e0f1;font-size:13px}.section-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.lesson-card{padding:19px;background:#fff;border:1px solid var(--line);border-radius:15px;display:flex;flex-direction:column;gap:10px}.lesson-card .bigico{font-size:25px}.lesson-card h3{font-size:16px;margin:0}.lesson-card p{font-size:13px;color:var(--muted);margin:0;flex:1}.tag{display:inline-block;font-size:11px;padding:4px 8px;border-radius:7px;background:#eff6ff;color:#1d4ed8;margin-right:4px}.lesson-layout{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:18px}.lesson-body{background:white;border:1px solid var(--line);border-radius:16px;padding:26px}.lesson-body h2{margin-top:25px;font-size:19px}.lesson-body h2:first-child{margin-top:0}.jpbox{background:#f4f8ff;border:1px solid #e0eaff;border-radius:12px;padding:16px;margin:13px 0}.jpbig{font-size:24px;font-weight:800}.furigana{font-size:13px;color:#64748b}.romaji{font-size:13px;color:#315aa6;margin-top:3px}.translation{margin-top:7px}.vocabtable{width:100%;border-collapse:collapse;margin-top:12px}.vocabtable th,.vocabtable td{text-align:left;border-bottom:1px solid var(--line);padding:11px 8px;font-size:13px;vertical-align:top}.vocabtable th{color:var(--muted);font-size:11px;text-transform:uppercase}.callout{border-left:4px solid var(--red);padding:10px 14px;background:#fff5f5;border-radius:0 9px 9px 0;font-size:13px}.sidebar-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;height:max-content}.sidebar-card h3{margin:0 0 12px;font-size:14px}.sideitem{padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;color:var(--muted)}.sideitem:last-child{border:0}.sideitem strong{display:block;color:var(--ink);font-size:12px}.flashwrap{max-width:700px;margin:0 auto}.flashcard{background:#fff;border:1px solid var(--line);border-radius:20px;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;box-shadow:var(--shadow);cursor:pointer}.flashcard .jpbig{font-size:39px;margin:10px 0}.flashcard .meaning{font-size:20px;font-weight:700;margin:12px 0}.flashcontrols{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:17px 0}.quizbox{max-width:760px;margin:auto}.question{font-size:20px;font-weight:800;margin:10px 0 18px}.options{display:grid;gap:10px}.option{border:1px solid var(--line);background:#fff;border-radius:11px;padding:13px 15px;text-align:left}.option:hover{border-color:#8eb3ff;background:#f8fbff}.option.correct{background:#eaf8f0;border-color:#7bc99e}.option.wrong{background:#fff0f0;border-color:#f1a0a0}.feedback{padding:14px;border-radius:11px;margin-top:14px;background:#f0f6ff;font-size:13px}.input{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:white;color:var(--ink);width:100%}.searchrow{display:flex;gap:10px;margin-bottom:16px}.searchrow input{max-width:430px}.muted{color:var(--muted)}.hidden{display:none!important}.toast{position:fixed;bottom:20px;right:20px;background:#142b4a;color:white;padding:12px 17px;border-radius:11px;box-shadow:var(--shadow);z-index:20}.mobilemenu{display:none}.empty{text-align:center;padding:40px;color:var(--muted)}.small{font-size:12px}.footer-note{font-size:12px;color:var(--muted);margin-top:20px}.badge{font-size:10px;font-weight:800;color:#8b5b09;background:#fff4d7;border-radius:6px;padding:4px 7px}
@media(max-width:1000px){.app{grid-template-columns:215px minmax(0,1fr)}.content{padding:24px 22px}.topbar{padding:0 22px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.layout2{grid-template-columns:1fr}.lesson-layout{grid-template-columns:1fr}.sidebar-card{display:none}}
@media(max-width:680px){.app{display:block}.sidebar{position:fixed;z-index:10;left:-270px;top:0;bottom:0;width:250px;transition:left .2s;box-shadow:8px 0 30px #0002}.sidebar.open{left:0}.mobilemenu{display:inline-grid;place-items:center;width:38px;height:38px;border:1px solid var(--line);background:white;border-radius:10px}.topbar{height:62px;padding:0 14px}.topright .pill{display:none}.content{padding:22px 14px 45px}.pagehead{flex-direction:column}.stats{gap:9px}.stat{padding:13px}.stat-num{font-size:24px}.card{padding:16px}.continue{align-items:flex-start;padding:13px;gap:11px}.lesson-art{width:55px;height:55px;font-size:25px}.section-grid{grid-template-columns:1fr}.chapter{padding:10px}.status{font-size:10px}.lesson-body{padding:18px}.jpbig{font-size:21px}.searchrow{flex-direction:column}.searchrow input{max-width:none}}

<body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">🏗️</div><div><strong>SSW Construction</strong><small>ACADEMY · JAPAN</small></div></div><div><div class="navlabel">Learning space</div><nav class="nav" id="nav"><button class="active" data-page="dashboard"><span class="ico">▦</span>Dashboard</button><button data-page="course"><span class="ico">📚</span>Course & Chapters</button><button data-page="fullbook"><span class="ico">📖</span>Complete JAC Textbook</button><button data-page="daily"><span class="ico">☑</span>Daily Learning</button><button data-page="vocabulary"><span class="ico">🗂️</span>Vocabulary Cards</button><button data-page="reading"><span class="ico">あ</span>Reading Practice</button><button data-page="quiz"><span class="ico">✎</span>Quizzes</button><button data-page="mock"><span class="ico">◷</span>Practice Mock Test</button><button data-page="revision"><span class="ico">↻</span>Revision Center</button><button data-page="progress"><span class="ico">▥</span>Progress Report</button></nav></div><div class="sidebar-foot"><strong>🎯 Your goal</strong><p style="margin:5px 0 0">Build your Japanese construction knowledge one hour at a time.</p></div></aside><main class="main"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="mobilemenu" id="mobilemenu">☰</button><div><div class="crumb">Learning space / <strong id="crumb">Dashboard</strong></div></div></div><div class="topright"><span class="pill">🇯🇵 SSW Construction</span><span id="authStatus" class="small muted">Not signed in</span><button id="googleLogin" class="btn">Sign in with Google</button><button id="googleLogout" class="btn secondary hidden">Sign out</button><div class="avatar">学</div></div></header><div class="content" id="content"></div></main></div><div id="toast" class="toast hidden"></div>
<script>
const lessons=[
{id:1,chapter:'Construction basics',title:'What is construction work?',icon:'🏗️',level:'Beginner',minutes:20,desc:'Understand the basic idea of construction projects and work stages.',objectives:['Understand 建設工事 and 工程.','Recognize common construction words.','Read a short introductory passage.'],explain:'Construction projects involve many steps. Different specialist contractors perform different kinds of work. Planning, safe working, and coordination help the project move forward.',passage:'建設工事では完成するまでに、たくさんの工程があります。',reading:'けんせつこうじ では かんせい する までに、たくさん の こうてい が あります。',romaji:'Kensetsu kouji dewa kansei suru made ni, takusan no koutei ga arimasu.',translation:'In construction work, there are many processes before completion.',vocab:[['建設工事','けんせつこうじ','kensetsu kouji','construction work'],['完成','かんせい','kansei','completion'],['工程','こうてい','koutei','process / work stage'],['たくさん','たくさん','takusan','many / a lot'],['あります','あります','arimasu','there is / there are']],questions:[{q:'What does 建設工事 mean?',opts:['Construction work','Safety helmet','Building material','Measurement'],a:0,why:'建設 (kensetsu) means construction and 工事 (kouji) means construction work.'},{q:'工程 (こうてい / koutei) means…',opts:['Salary','Work process or stage','Rain','Worker'],a:1,why:'工程 means a process or stage in a job or project.'},{q:'What is the meaning of 完成?',opts:['Beginning','Danger','Completion','Equipment'],a:2,why:'完成 (kansei) means completion or being finished.'}]},
{id:2,chapter:'Construction basics',title:'People and specialist contractors',icon:'👷',level:'Beginner',minutes:20,desc:'Learn words for workers, specialist trades, and contractors.',objectives:['Recognize 職種 and 専門工事業者.','Understand how different workers contribute.','Practice reading a construction sentence.'],explain:'Large construction projects often involve different specialist contractors. Each contractor handles work within its area of expertise. Clear communication helps different teams coordinate.',passage:'さまざまな職種の専門工事業者が仕事をします。',reading:'さまざまな しょくしゅ の せんもんこうじぎょうしゃ が しごと を します。',romaji:'Samazamana shokushu no senmon kouji gyousha ga shigoto o shimasu.',translation:'Specialist contractors from various trades do the work.',vocab:[['職種','しょくしゅ','shokushu','job type / trade'],['専門','せんもん','senmon','specialty'],['工事業者','こうじぎょうしゃ','kouji gyousha','construction contractor'],['仕事','しごと','shigoto','work / job'],['さまざまな','さまざまな','samazamana','various']],questions:[{q:'職種 (shokushu) means…',opts:['Job type / trade','Completion','Toolbox','Weather'],a:0,why:'職種 identifies a type of occupation or trade.'},{q:'専門 (senmon) means…',opts:['Dangerous','Specialty','To measure','Tomorrow'],a:1,why:'専門 means specialization or a field of expertise.'},{q:'仕事 (shigoto) means…',opts:['Work / job','Building','Read','Slowly'],a:0,why:'仕事 is the common Japanese word for work or job.'}]},
{id:3,chapter:'Safety',title:'Safety comes first',icon:'🦺',level:'Beginner',minutes:20,desc:'Learn essential safety vocabulary and protective equipment.',objectives:['Learn 安全 and 危険.','Recognize protective equipment vocabulary.','Understand a basic safety statement.'],explain:'Construction sites can have hazards. Workers should follow site rules, use the required protective equipment, and pay attention to warnings. Always follow official workplace instructions and training.',passage:'工事現場では、安全が大切です。',reading:'こうじげんば では、あんぜん が たいせつ です。',romaji:'Kouji genba dewa, anzen ga taisetsu desu.',translation:'Safety is important at a construction site.',vocab:[['工事現場','こうじげんば','kouji genba','construction site'],['安全','あんぜん','anzen','safety'],['危険','きけん','kiken','danger'],['大切','たいせつ','taisetsu','important'],['ヘルメット','ヘルメット','herumetto','helmet']],questions:[{q:'安全 (anzen) means…',opts:['Danger','Safety','Contractor','Drawing'],a:1,why:'安全 means safety or being safe.'},{q:'危険 (kiken) means…',opts:['Important','Completion','Danger','Tool'],a:2,why:'危険 means danger or hazardous.'},{q:'工事現場 is a…',opts:['Construction site','Classroom','Train station','Restaurant'],a:0,why:'工事現場 (kouji genba) means construction site.'}]},
{id:4,chapter:'Tools and materials',title:'Tools and materials',icon:'🧰',level:'Beginner',minutes:20,desc:'Start recognizing common tool, material, and equipment terms.',objectives:['Recognize 道具 and 材料.','Learn common construction words.','Practice matching Japanese and English.'],explain:'Workers select tools and materials for the task. The right tool, correct material, and proper use matter for quality and safety. Always use equipment according to training and site rules.',passage:'仕事に使う道具と材料を確認します。',reading:'しごと に つかう どうぐ と ざいりょう を かくにん します。',romaji:'Shigoto ni tsukau dougu to zairyou o kakunin shimasu.',translation:'Check the tools and materials used for the work.',vocab:[['道具','どうぐ','dougu','tool'],['材料','ざいりょう','zairyou','material'],['使う','つかう','tsukau','to use'],['確認','かくにん','kakunin','check / confirm'],['作業','さぎょう','sagyou','work / operation']],questions:[{q:'道具 (dougu) means…',opts:['Tool','Material','Safety','Completion'],a:0,why:'道具 means a tool or implement.'},{q:'材料 (zairyou) means…',opts:['Contractor','Material','Danger','Process'],a:1,why:'材料 means material or ingredient.'},{q:'確認する (kakunin suru) means…',opts:['To finish','To check / confirm','To build','To stop'],a:1,why:'確認 means checking or confirming something.'}]},
{id:5,chapter:'Measurements',title:'Measurements and checking',icon:'📏',level:'Beginner',minutes:20,desc:'Learn basic words for measuring, size, and checking drawings or work.',objectives:['Recognize 寸法 and 測る.','Understand simple checking language.','Review key vocabulary.'],explain:'Measurements help workers check dimensions and whether work matches the required plan. Confirm units and instructions before measuring or cutting materials.',passage:'寸法を測って、図面を確認します。',reading:'すんぽう を はかって、ずめん を かくにん します。',romaji:'Sunpou o hakatte, zumen o kakunin shimasu.',translation:'Measure the dimensions and check the drawing.',vocab:[['寸法','すんぽう','sunpou','dimension / measurement'],['測る','はかる','hakaru','to measure'],['図面','ずめん','zumen','drawing / blueprint'],['長さ','ながさ','nagasa','length'],['確認する','かくにんする','kakunin suru','to check / confirm']],questions:[{q:'図面 (zumen) means…',opts:['Blueprint / drawing','Helmet','Worker','Material'],a:0,why:'図面 means a technical drawing or plan.'},{q:'測る (hakaru) means…',opts:['To measure','To protect','To complete','To carry'],a:0,why:'測る is the verb “to measure.”'},{q:'寸法 (sunpou) means…',opts:['Danger','Dimensions','Contractor','Safety'],a:1,why:'寸法 refers to dimensions or measurements.'}]},
{id:6,chapter:'Work processes',title:'Work stages and completion',icon:'🧱',level:'Beginner',minutes:20,desc:'Review common terms for stages, progress, and completion.',objectives:['Review 工程 and 完成.','Understand a basic work sequence.','Connect vocabulary across lessons.'],explain:'Construction work is organized into stages. Teams coordinate their work so that tasks happen in the right order. The exact process depends on the project and the official site plan.',passage:'工事の工程を確認してから作業を始めます。',reading:'こうじ の こうてい を かくにん してから さぎょう を はじめます。',romaji:'Kouji no koutei o kakunin shite kara sagyou o hajimemasu.',translation:'After checking the work process, begin the task.',vocab:[['始める','はじめる','hajimeru','to begin'],['作業','さぎょう','sagyou','work / operation'],['工程','こうてい','koutei','process / work stage'],['工事','こうじ','kouji','construction work'],['完成','かんせい','kansei','completion']],questions:[{q:'始める (hajimeru) means…',opts:['To begin','To measure','To forget','To finish'],a:0,why:'始める means to begin or start.'},{q:'作業 (sagyou) means…',opts:['Work / operation','Blueprint','Material','Danger'],a:0,why:'作業 means work, an operation, or a task.'},{q:'Which word means completion?',opts:['危険','完成','道具','職種'],a:1,why:'完成 (kansei) means completion.'}]},
{"id":7,"chapter":"JAC construction course","title":"Construction team and teamwork","icon":"🤝","level":"Beginner","minutes":20,"desc":"People on a site must coordinate their work. A steel worker, carpenter, electrician, and painter do different jobs, but their…","objectives":["Understand the basic idea of construction team and teamwork.","Learn five important Japanese construction terms.","Read a short Japanese sentence with romaji and English meaning."],"explain":"People on a site must coordinate their work. A steel worker, carpenter, electrician, and painter do different jobs, but their tasks affect one another. Teams share information and follow the work plan so that one task is ready before the next begins.","passage":"現場では、チームワークが大切です。","reading":"げんば チームワーク たいせつ 現場では、チームワークが大切です。","romaji":"Genba dewa, chiimuwaaku ga taisetsu desu.","translation":"Teamwork is important at the worksite.","vocab":[["現場","げんば","genba","worksite"],["チームワーク","チームワーク","chiimuwaaku","teamwork"],["大切","たいせつ","taisetsu","important"],["職人","しょくにん","shokunin","craftsperson"],["協力","きょうりょく","kyouryoku","cooperation"]],"questions":[{"q":"What does 現場 (genba) mean?","opts":["worksite","teamwork","important","construction schedule"],"a":0,"why":"現場 (genba) means worksite. Learn the Japanese term because the exam uses Japanese wording."},{"q":"What does チームワーク (chiimuwaaku) mean?","opts":["teamwork","important","craftsperson","construction schedule"],"a":0,"why":"チームワーク (chiimuwaaku) means teamwork. Learn the Japanese term because the exam uses Japanese wording."},{"q":"What does 大切 (taisetsu) mean?","opts":["important","craftsperson","cooperation","construction schedule"],"a":0,"why":"大切 (taisetsu) means important. Learn the Japanese term because the exam uses Japanese wording."}]},{"id":8,"chapter":"JAC construction course","title":"Construction work roles","icon":"👷","level":"Beginner","minutes":20,"desc":"A project may include a client, designer, managing engineer, general contractor, si nt and units","icon":"📏","level":"Beginner","minutes":20,"desc":"Accurate measurement supports quality and safety. Read the instrument correctly, use the specified unit, and measure from the…","objectives":["Understand the basic idea of measurement and units.","Learn five important Japanese construction terms.","Read a short Japanese sentence with romaji and English meaning."],"explain":"Accurate measurement supports quality and safety. Read the instrument correctly, use the specified unit, and measure from the correct reference point. Recheck important measurements and record them according to site procedure.","passage":"長さを測って、記録します。","reading":"はかる ながさ たかさ 長さを測って、記録します。","romaji":"Nagasa o hakatte, kiroku shimasu.","translation":"Measure the length and record it.","vocab":[["測る","はかる","hakaru","to measure"],["長さ","ながさ","nagasa","length"],["高さ","たかさ","takasa","height"],["幅","はば","haba","width"],["記録","きろく","kiroku","record"]],"questions":[{"q":"What does 測る (hakaru) mean?","opts":["to measure","length","height","construction schedule"],"a":0,"why":"測る (hakaru) means to measure. Learn the Japanese term because the exam uses Japanese wording."},{"q":"What does 長さ (nagasa) mean?","opts":["length","height","width","construction schedule"],"a":0,"why":"長さ (nagasa) means length. Learn the Japanese term because the exam uses Japanese wording."},{"q":"What does 高さ (takasa) mean?","opts":["height","width","record","construction schedule"],"a":0,"why":"高さ (takasa) means height. Learn the Japanese term because the exam uses Japanese wording."}]},{"id":18,"chapter":"JAC construction course","title":"Concrete and curing basics","icon":"🏗️","level":"Beginner","minutes":20,"desc":"Concrete work involves preparing the formwork and reinforcement, placing concrete, compacting it as specified, and allowing i…","objectives":["Understand the basic idea of concrete and curing basics.","Learn five important Japanese construction terms.","Read a short Japanese sentence with romaji and En function toggleTask(k,v){state.tasks[k]=v;save();render()}function markComplete(id){if(!state.completed.includes(id))state.completed.push(id);save();toast('Lesson progress saved!');render()}
function dailyPage(){let tasks=[['vocab','Vocabulary revision','Review 10 words with flashcards.','10 min'],['lesson','Learn a concept','Read one new lesson and its examples.','20 min'],['reading','Reading practice','Read the passage aloud and follow the romaji.','15 min'],['quiz','Quiz and error review','Answer questions and revisit mistakes.','15 min']];return `${head('Your daily 60-minute plan','A manageable routine: learn a little, recall it, and repeat.')}<div class="card" style="max-width:850px">${cardHead('Daily checklist','Tick each task as you finish it.')}<div class="progressrow"><span>Today’s progress</span><strong>${Object.values(state.tasks).filter(Boolean).length}/4 complete</strong></div><div class="progress"><span style="width:${Object.values(state.tasks).filter(Boolean).length/4*100}%"></span></div>${tasks.map(t=>`<label class="task ${state.tasks[t[0]]?'checked':''}" style="padding:17px 0"><input type="checkbox" ${state.tasks[t[0]]?'checked':''} onchange="toggleTask('${t[0]}',this.checked)"><span style="flex:1"><strong>${t[1]}</strong><small>${t[2]}</small></span><span class="status">${t[3]}</span></label>`).join('')}<button class="btn" style="margin-top:17px" onclick="navTo('vocabulary')">Begin with vocabulary →</button><button class="btn secondary" style="margin:17px 0 0 8px" onclick="resetTasks()">Reset daily checklist</button></div>`}function resetTasks(){state.tasks={};save();render()}
function vocabPage(){return `${head('Vocabulary cards','Learn Japanese construction words with readings, romaji, and English meanings.')}<div class="flashwrap"><div class="progressrow"><span>Card ${flashIndex+1} of ${allVocab.length}</span><span>${state.known.length} marked known</span></div><div class="flashcard" onclick="revealFlash()"><div class="eyebrow">${flashReveal?'Answer':'Tap card to reveal'}</div><div class="jpbig">${allVocab[flashIndex].jp}</div><div class="furigana">${flashReveal?allVocab[flashIndex].reading:'••••••••'}</div>${flashReveal?`<div class="romaji">${allVocab[flashIndex].romaji}</div><div class="meaning">${allVocab[flashIndex].meaning}</div>`:'<p class="muted">Think of the meaning before revealing.</p>'}</div><div class="flashcontrols"><button class="btn secondary" onclick="prevFlash()">← Previous</button><button class="btn ghost" onclick="revealFlash()">${flashReveal?'Hide answer':'Reveal answer'}</button><button class="btn" onclick="markKnown()">I know this ✓</button><button class="btn secondary" onclick="nextFlash()">Next →</button></div><div class="card">${cardHead('Quick study tips')}<p class="small muted">Say the Japanese aloud, recall the English meaning, then check the reading and romaji. Use “I know this” only when you can recall the meaning without looking.</p><div class="progressrow"><span>Vocabulary mastery</span><strong>${Math.round(state.known.length/allVocab.length*100)}%</strong></div><div class="progress"><span style="width:${state.known.length/allVocab.length*100}%"></span></div><div style="margin-top:15px"><button class="btn secondary" onclick="navTo('revision')">Review words I need to practice</button></div></div></div>`}function revealFlash(){flashReveal=!flashReveal;render()}function nextFlash(){flashIndex=(flashIndex+1)%allVocab.length;flashReveal=false;render()}function prevFlash(){flashIndex=(flashIndex-1+allVocab.length)%allVocab.length;flashReveal=false;render()}function markKnown(){let jp=allVocab[flashIndex].jp;if(!state.known.includes(jp))state.known.push(jp);save();toast('Marked as known');nextFlash()}
function readingPage(){return `${head('Japanese reading practice','Use this routine: Japanese first, romaji second, English last.')}<div class="section-grid">${lessons.map(l=>`<div class="lesson-card"><span class="bigico">📖</span><span class="tag">${l.chapter}</span><h3>${l.title}</h3><div class="jpbox" style="margin:0"><div style="font-size:18px;font-weight:800">${l.passage}</div><div class="furigana">${l.reading}</div><div class="romaji">${l.romaji}</div><details style="margin-top:9px"><summary style="cursor:pointer;color:#2563eb;font-size:12px;font-weight:700">Reveal English translation</summary><p class="small">${l.translation}</p><p class="small"><strong>Tip:</strong> ${l.vocab.slice(0,2).map(v=>v[0]+' = '+v[3]).join('; ')}.</p></details></div><button class="btn secondary" onclick="openLesson(${l.id})">Study full lesson →</button></div>`).join('')}</div>`}
function startQuiz(id=null,mode='quiz'){let ls=id?lessons.filter(l=>l.id===id):lessons;quizQuestions=ls.flatMap(l=>l.questions.map(q=>({...q,lesson:l.title}))).sort(()=>Math.random()-.5);if(mode==='mock')quizQuestions=quizQuestions.slice(0,10);quizIndex=0;quizScore=0;quizAnswered=false;quizMode=mode;mockAnswers=[];page=mode==='mock'?'mock':'quiz';render()}
function quizPage(){if(!quizQuestions.length)return `${head('Quizzes','Practice construction vocabulary and lesson concepts.')}<div class="section-grid">${lessons.map(l=>`<div class="lesson-card"><span class="bigico">✎</span><h3>${l.title}</h3><p>${l.questions.length} starter questions with explanations.</p><button class="btn" onclick="startQuiz(${l.id})">Start quiz →</button></div>`).join('')}<div class="lesson-card"><span class="bigico">🎯</span><h3>Mixed review quiz</h3><p>Questions selected from all available starter lessons.</p><button class="btn" onclick="startQuiz()">Start mixed quiz →</button></div></div>`;return quizRender(false)}function mockPage(){if(!quizQuestions.length)return `${head('Practice mock test','An original practice test based on the starter lessons, not an official examination.')}<div class="card" style="max-width:780px"><span class="badge">NOT AN OFFICIAL EXAM</span><h2>Ready to test your understanding?</h2><p class="muted">This practice set uses questions from the included starter lessons. It does not replicate or claim to verify the current official exam format.</p><ul><li>10 randomized questions (or fewer if fewer are available).</li><li>Choose one answer for each question.</li><li>Review your score and explanations at the end.</li></ul><button class="btn" onclick="startQuiz(null,'mock')">Start practice test →</button></div>`;return quizRender(true)}function quizRender(isMock){if(quizIndex>=quizQuestions.length)return `<div class="quizbox card" style="text-align:center"><div style="font-size:45px">${quizScore/quizQuestions.length>=.7?'🎉':'💪'}</div><div class="eyebrow">${isMock?'Practice test':'Quiz'} complete</div><h1 style="font-size:38px">${quizScore}/${quizQuestions.length}</h1><p class="muted">${Math.round(quizScore/quizQuestions.length*100)}% correct. ${quizScore/quizQuestions.length>=.7?'Good work. Keep revising to make the knowledge stick.':'Review the explanations and try again.'}</p><button class="btn" onclick="startQuiz(null,${isMock?'\'mock\'':'\'quiz\''})">Try again</button> <button class="btn secondary" onclick="navTo('revision')">Go to revision</button></div>`;let q=quizQuestions[quizIndex];return `${head(isMock?'Practice mock test':'Practice quiz',`Question ${quizIndex+1} of ${quizQuestions.length} · ${isMock?'Starter practice':'Immediate feedback'}`)}<div class="quizbox card"><div class="progressrow"><span>${q.lesson||'Mixed review'}</span><strong>Score: ${quizScore}</strong></div><div class="progress"><span style="width:${quizIndex/quizQuestions.length*100}%"></span></div><div class="question">${q.q}</div><div class="options">${q.opts.map((o,i)=>`<button class="option ${quizAnswered?(i===q.a?'correct':mockAnswers[quizIndex]===i?'wrong':''):''}" ${quizAnswered?'disabled':''} onclick="answerQuiz(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div>${quizAnswered?`<div class="feedback"><strong>${mockAnswers[quizIndex]===q.a?'Correct!':'Review this answer'}</strong><p>${q.why}</p><button class="btn" onclick="nextQuestion()">${quizIndex===quizQuestions.length-1?'See results':'Next question →'}</button></div>`:''}</div>`}function answerQuiz(i){if(quizAnswered)return;quizAnswered=true;mockAnswers[quizIndex]=i;if(i===quizQuestions[quizIndex].a)quizScore++;if(!quizQuestions[quizIndex].lesson){}save();render()}function nextQuestion(){quizIndex++;quizAnswered=false;if(quizIndex>=quizQuestions.length){state.quizHistory.push({date:new Date().toLocaleDateString(),score:quizScore,total:quizQuestions.length,mode:quizMode});save()}render()}
function revisionPage(){let forgotten=allVocab.filter(v=>!state.known.includes(v.jp));return `${head('Revision center','Focus on vocabulary you have not marked as known and revisit completed lessons.')}<div class="stats"><div class="stat"><div class="stat-top">Needs more practice <span class="stat-icon">↻</span></div><div class="stat-num">${forgotten.length}</div><div class="stat-note">Words not yet marked known</div></div><div class="stat"><div class="stat-top">Completed lessons <span class="stat-icon">✓</span></div><div class="stat-num">${state.completed.length}</div><div class="stat-note">Revisit these anytime</div></div></div><div class="card">${cardHead('Words to revise','Open flashcards and practise recall.')}<div class="section-grid">${forgotten.slice(0,12).map(v=>`<div class="chapter"><div class="chapterinfo"><strong>${v.jp} <span class="muted">${v.reading}</span></strong><small>${v.romaji}</small></div><span class="status">Practice</span></div>`).join('')||'<p>You marked every vocabulary word as known. Test yourself again later to make sure you still remember them.</p>'}</div><button class="btn" style="margin-top:16px" onclick="flashIndex=0;flashReveal=false;navTo('vocabulary')">Start flashcards →</button></div><div class="card" style="margin-top:16px">${cardHead('Lesson revision')}<div class="chapterlist">${lessons.filter(l=>state.completed.includes(l.id)).map(l=>`<div class="chapter"><div class="chaptericon">${l.icon}</div><div class="chapterinfo"><strong>${l.title}</strong><small>${l.chapter}</small></div><button class="btn secondary" onclick="openLesson(${l.id})">Review</button></div>`).join('')||'<p class="muted small">Complete a lesson to see it listed here.</p>'}</div></div>`}
function progressPage(){let avg=state.quizHistory.length?Math.round(state.quizHistory.reduce((a,h)=>a+h.score/h.total,0)/state.quizHistory.length*100):0;return `${head('Progress report','A simple overview saved in this browser on this device.')}<div class="stats"><div class="stat"><div class="stat-top">Course completion</div><div class="stat-num">${pct()}%</div><div class="progress"><span style="width:${pct()}%"></span></div></div><div class="stat"><div class="stat-top">Vocabulary known</div><div class="stat-num">${state.known.length}/${allVocab.length}</div><div class="progress"><span style="width:${state.known.length/allVocab.length*100}%"></span></div></div><div class="stat"><div class="stat-top">Quiz attempts</div><div class="stat-num">${state.quizHistory.length}</div><div class="stat-note">Saved quiz records</div></div><div class="stat"><div class="stat-top">Average quiz score</div><div class="stat-num">${avg}%</div><div class="stat-note">Across completed attempts</div></div></div><div class="card">${cardHead('Lesson progress')}<div class="chapterlist">${lessons.map(l=>`<div class="chapter"><div class="chaptericon">${l.icon}</div><div class="chapterinfo"><strong>${l.title}</strong><div class="progress" style="margin-top:6px"><span style="width:${state.completed.includes(l.id)?100:0}%"></span></div></div><span class="status ${state.completed.includes(l.id)?'done':''}">${state.completed.includes(l.id)?'Complete':'Not started'}</span></div>`).join('')}</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:20px"><button class="btn secondary" onclick="exportData()">Export progress</button><label class="btn secondary" for="importfile">Import progress</label><input id="importfile" type="file" accept="application/json" class="hidden" onchange="importData(event)"><button class="btn secondary" onclick="clearProgress()">Reset all progress</button></div><p class="footer-note">Progress is stored in this browser's localStorage. It does not automatically sync to another device. Export a backup before clearing browser data.</p></div><div class="card" style="margin-top:16px">${cardHead('Recent quiz attempts')} ${state.quizHistory.length?`<table class="vocabtable"><thead><tr><th>Date</th><th>Type</th><th>Score</th></tr></thead><tbody>${state.quizHistory.slice().reverse().map(h=>`<tr><td>${h.date}</td><td>${h.mode==='mock'?'Practice test':'Quiz'}</td><td>${h.score}/${h.total} (${Math.round(h.score/h.total*100)}%)</td></tr>`).join('')}</tbody></table>`:'<p class="muted small">Your completed quiz attempts will appear here.</p>'}</div>`}
function exportData(){let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ssw-academy-progress.json';a.click();URL.revokeObjectURL(url);toast('Progress export started')}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d||!Array.isArray(d.completed)||!Array.isArray(d.known))throw Error();state={...state,...d};save();render();toast('Progress imported')}catch(err){toast('That file is not a valid progress backup')}};r.readAsText(f)}function clearProgress(){if(confirm('Reset all saved SSW Academy progress on this browser? Export a backup first if you need it.')){localStorage.removeItem('sswAcademyState');state={completed:[],known:[],tasks:{},quizHistory:[],dailyDone:{}};save();render();toast('Progress reset')}}
// Cloud sync bridge: Firebase module uses these functions to access this app's state.
window.sswGetLocalState = () => JSON.parse(JSON.stringify(state));
window.sswApplyCloudState = (cloudState) => {
  if (!cloudState || typeof cloudState !== 'object') return;
  state = { ...state, ...cloudState };
  state.completed = Array.isArray(state.completed) ? state.completed : [];
  state.known = Array.isArray(state.known) ? state.known : [];
  state.tasks = state.tasks && typeof state.tasks === 'object' ? state.tasks : {};
  state.quizHistory = Array.isArray(state.quizHistory) ? state.quizHistory : [];
  state.dailyDone = state.dailyDone && typeof state.dailyDone === 'object' ? state.dailyDone : {};
  localStorage.setItem('sswAcademyState', JSON.stringify(state));
  render();
};
render();
</script>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, setPersistence, browserLocalPersistence, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/12.5.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: 'AIzaSyDnVqRG0mO5fGJH4gprJcz9cx0N7Ffpz80',
  authDomain: 'ssw-cons.firebaseapp.com',
  projectId: 'ssw-cons',
  storageBucket: 'ssw-cons.firebasestorage.app',
  messagingSenderId: '885529089010',
  appId: '1:885529089010:web:a68f747d9ccf7cf914d16b',
  measurementId: 'G-2N70C3YC6Z'
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
// Keep the Google session between page reloads.
await setPersistence(auth, browserLocalPersistence);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();
const loginButton = document.getElementById('googleLogin');
const logoutButton = document.getElementById('googleLogout');
const authStatus = document.getElementById('authStatus');
let activeUser = null;
let cloudReady = false;
let writeQueue = Promise.resolve();

function showStatus(message) {
  if (authStatus) authStatus.textContent = message;
}
function progressRef(user) {
  return doc(db, 'users', user.uid, 'progress', 'main');
}
function snapshotState(value) {
  return JSON.parse(JSON.stringify(value || {}));
}

loginButton?.addEventListener('click', async () => {
  try {
    showStatus('Opening Google sign-in…');
    const result = await signInWithPopup(auth, provider);
    if (result.user) {
      showStatus('Signed in · loading progress…');
    }
  } catch (error) {
    console.error('Google sign-in failed:', error);
    showStatus('Sign-in failed. Check Firebase settings.');
    alert('Google sign-in failed: ' + (error.message || error));
  }
});

logoutButton?.addEventListener('click', async () => {
  try {
    await signOut(auth);
    showStatus('Signed out');
  } catch (error) {
    console.error('Sign-out failed:', error);
    showStatus('Could not sign out');
  }
});

// Called by the existing app whenever the learner's progress changes.
window.sswCloudSave = (currentState) => {
  if (!activeUser || !cloudReady) return;
  const userAtSave = activeUser;
  const savedState = snapshotState(currentState);
  writeQueue = writeQueue
    .then(async () => {
      if (activeUser?.uid !== userAtSave.uid) return;
      await setDoc(progressRef(userAtSave), {
        state: savedState,
        updatedAt: serverTimestamp()
      });
      if (activeUser?.uid === userAtSave.uid) showStatus('Synced to cloud');
    })
    .catch((error) => {
      console.error('Cloud save failed:', error);
      if (activeUser?.uid === userAtSave.uid) showStatus('Cloud sync error');
    });
};

onAuthStateChanged(auth, async (user) => {
  activeUser = user || null;
  cloudReady = false;
  if (!user) {
    if (loginButton) loginButton.classList.remove('hidden');
    if (logoutButton) logoutButton.classList.add('hidden');
    showStatus('Not signed in · saved on this device');
    return;
  }

  if (loginButton) loginButton.classList.add('hidden');
  if (logoutButton) logoutButton.classList.remove('hidden');
  showStatus('Loading cloud progress…');

  try {
    const ref = progressRef(user);
    const result = await getDoc(ref);
    if (activeUser?.uid !== user.uid) return;

    if (result.exists() && result.data()?.state) {
      // Existing cloud progress is the source of truth when signing in on another device.
      window.sswApplyCloudState(result.data().state);
      cloudReady = true;
      showStatus('Signed in · progress synced');
    } else {
      // First sign-in: keep and upload the learner's current browser progress.
      const localState = window.sswGetLocalState();
      await setDoc(ref, { state: localState, updatedAt: serverTimestamp() });
      if (activeUser?.uid !== user.uid) return;
      cloudReady = true;
      showStatus('Signed in · progress backed up');
    }
  } catch (error) {
    console.error('Cloud progress load failed:', error);
    cloudReady = false;
    showStatus('Cloud error · local progress remains saved');
    alert('Could not sync progress with Firebase. Your progress is still saved in this browser. Check your Firestore rules and Firebase settings.');
  }
});
</script>
